<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Johnson Family — Kitchen</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="kiosk.css" />
</head>
<body>

<div class="kiosk">

  <header class="bar">
    <div class="bar-date">
      <span class="bar-weekday" id="bar-weekday">&mdash;</span>
      <span class="bar-full" id="bar-full">&mdash;</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="bar-clock" id="bar-clock">&mdash;</div>
  </header>

  <div class="views">

    <!-- ── Dashboard ────────────────────────────────────────── -->
    <div class="view grid" id="view-dashboard">

      <section class="panel">
        <div class="panel-head">
          <span>This week</span>
          <span class="cal-legend" id="cal-legend"></span>
        </div>
        <div class="panel-body frame-body">
          <iframe id="cal-week" title="Week calendar" frameborder="0" scrolling="no"></iframe>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">Coming up</div>
        <div class="panel-body frame-body">
          <iframe id="cal-agenda" title="Agenda" frameborder="0" scrolling="no"></iframe>
        </div>
      </section>

      <div class="stack">

        <section class="panel">
          <div class="panel-head">
            <span class="head-left">
              Grocery list
              <span class="count" id="grocery-count"></span>
            </span>
            <button class="add-btn" id="grocery-add">+ Add</button>
          </div>
          <div class="store-strip" id="store-strip"></div>
          <div class="panel-body scroll" id="grocery-list"></div>
          <div class="panel-foot" id="grocery-other"></div>
        </section>

        <section class="panel">
          <div class="panel-head">Dinners this week</div>
          <div class="panel-body scroll" id="meal-list"></div>
        </section>

      </div>

    </div>

    <!-- ── Christmas ────────────────────────────────────────── -->
    <div class="view hidden" id="view-christmas">
      <section class="panel">
        <div class="panel-head">
          <span class="tab-row" id="xmas-tabs"></span>
          <button class="add-btn xmas" id="xmas-add">+ Add</button>
        </div>
        <div class="panel-body scroll cards" id="xmas-items"></div>
      </section>
    </div>

    <!-- ── Recipes ──────────────────────────────────────────── -->
    <div class="view hidden" id="view-recipes">
      <section class="panel">
        <div class="panel-head">
          <span class="head-left">
            Recipes
            <span class="count" id="recipe-count"></span>
          </span>
          <button class="add-btn ghost" id="recipe-reset">Clear filters</button>
        </div>
        <div class="filters" id="recipe-filters"></div>
        <div class="panel-body scroll cards" id="recipe-list"></div>
      </section>
    </div>

    <!-- ── Trips ────────────────────────────────────────────── -->
    <div class="view hidden" id="view-trips">
      <section class="panel">
        <div class="panel-head">
          <span class="tab-row" id="trip-tabs"></span>
        </div>
        <div class="panel-body frame-body" id="trip-body">
          <iframe id="trip-frame" title="Trip dashboard" frameborder="0"></iframe>
        </div>
        <div class="panel-body empty-state hidden" id="trip-empty">
          No trips saved yet. Add one from your phone.
        </div>
      </section>
    </div>

  </div>

</div>

<div class="sheet-overlay hidden" id="sheet">
  <div class="sheet">
    <div class="sheet-head">
      <span id="sheet-title">Add an item</span>
      <button class="sheet-close" id="sheet-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="sheet-tabs hidden" id="sheet-tabs"></div>
    <div class="sheet-chips" id="sheet-chips"></div>
    <div class="sheet-row move-row hidden" id="sheet-move"></div>
    <div class="sheet-row">
      <input type="text" id="sheet-input" autocomplete="off" autocapitalize="words" />
      <input type="text" id="sheet-input2" class="hidden" autocomplete="off" autocapitalize="words" />
      <button class="sheet-save" id="sheet-save">Add</button>
    </div>
  </div>
</div>

<div class="sheet-overlay hidden" id="rsheet">
  <div class="sheet sheet-wide">
    <div class="sheet-head">
      <span id="rsheet-title">Recipe</span>
      <button class="sheet-close" id="rsheet-close" aria-label="Close">&#10005;</button>
    </div>
    <div class="rsheet-meta" id="rsheet-meta"></div>
    <div class="rsheet-body">
      <div class="rsheet-col">
        <div class="rsheet-h">Ingredients <span class="hint">tap to add to list</span></div>
        <div id="rsheet-ings"></div>
      </div>
      <div class="rsheet-col">
        <div class="rsheet-h">Directions</div>
        <ol id="rsheet-steps"></ol>
      </div>
    </div>
    <div class="sheet-row">
      <span class="plan-label">Plan it for</span>
      <span class="plan-days" id="rsheet-days"></span>
    </div>
  </div>
</div>

<script type="module" src="kiosk.js"></script>
</body>
</html>
